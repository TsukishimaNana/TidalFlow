appId: com.tidalflow.adhd-time-manager
productName: TidalFlow
directories:
  output: dist
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!**/.idea/*'
  - '!**/dist/**'
  - '!**/*.map'
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
linux:
  category: Utility
  target:
    - AppImage
    - deb
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  perMachine: false
