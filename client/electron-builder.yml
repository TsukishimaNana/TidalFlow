appId: com.tidalflow.adhd-time-manager
productName: TidalFlow
directories:
  output: dist
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!**/.idea/*'
  - '!**/dist/**'
  - '!**/*.map'
extraResources:
  - from: build
    to: build
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
win:
  target:
    - target: nsis
      arch:
        - x64
linux:
  category: Utility
  target:
    - AppImage
    - deb
